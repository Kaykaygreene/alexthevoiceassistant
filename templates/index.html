<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alex — Voice Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="panel">
    <div class="orb-wrap">
      <div id="orb" class="orb"></div>
    </div>

    <h1>Alex</h1>
    <p class="tagline">Speak, and he'll listen.</p>

    <form id="startForm" class="control-row">
<input id="nameInput" type="text" placeholder="Your name (optional)" autocomplete="off" spellcheck="false" />      <button id="startBtn" type="submit">Start</button>
    </form>

    <button id="stopBtn" type="button" disabled>End conversation</button>

    <p id="status">Status: idle</p>

    <div id="transcript" class="transcript"></div>
  </main>

  <script type="module" src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
